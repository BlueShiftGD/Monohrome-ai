<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>WORST NIGHTMARE</title>
    <style>
        @font-face {
            font-family: "MonoFont";
            src: url("font.ttf")
        }

        @font-face {
            font-family: "MonoFontBold";
            src: url("font_bold.ttf")
        }

        :root {
            --bg: #050505;
            --panel: #0b0808;
            --blood: #8b0f0f;
            --blood-hi: #c01818;
            --ink: #d6d0cc;
            --dim: #7a706b;
            --line: #2a1a1a;
            --safe-t: env(safe-area-inset-top,0px);
            --safe-r: env(safe-area-inset-right,0px);
            --safe-b: env(safe-area-inset-bottom,0px);
            --safe-l: env(safe-area-inset-left,0px);
        }

        html, body {
            margin: 0;
            height: 100%;
            background: #000;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            font-family: "MonoFont",ui-monospace,Menlo,Consolas,monospace;
            color: var(--ink)
        }

        #wrap {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center
        }

        canvas {
            display: block;
            background: #000;
            touch-action: none;
            outline: none
        }

        #rot {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 28;
            background: #000;
            color: #ddd;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            font: 22px "MonoFont",monospace
        }

        /* ---------- кнопка полноэкранного режима ---------- */
        #btn-fs {
            position: fixed;
            z-index: 30;
            top: calc(8px + var(--safe-t));
            right: calc(8px + var(--safe-r));
            width: 42px;
            height: 42px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(8,4,4,.72);
            border: 1px solid var(--blood);
            border-radius: 6px;
            color: var(--ink);
            cursor: pointer;
            opacity: .75;
            transition: opacity .15s,border-color .15s,background .15s;
            touch-action: manipulation
        }

            #btn-fs:hover, #btn-fs:active {
                opacity: 1;
                border-color: var(--blood-hi);
                background: rgba(40,6,6,.85)
            }

            #btn-fs svg {
                width: 22px;
                height: 22px;
                stroke: currentColor;
                fill: none;
                stroke-width: 2;
                stroke-linecap: round;
                stroke-linejoin: round
            }

            #btn-fs .ico-exit {
                display: none
            }

            #btn-fs.on .ico-enter {
                display: none
            }

            #btn-fs.on .ico-exit {
                display: block
            }

        /* ---------- HUD поверх canvas ---------- */
        #wn-toast {
            display: none;
            position: fixed;
            z-index: 12;
            top: calc(14px + var(--safe-t));
            left: 50%;
            transform: translateX(-50%);
            max-width: min(86vw,520px);
            padding: 10px 18px;
            background: rgba(10,4,4,.88);
            border: 1px solid var(--blood);
            border-radius: 4px;
            color: #e8dcd8;
            font-size: 16px;
            line-height: 1.3;
            text-align: center;
            pointer-events: none;
            box-shadow: 0 0 18px rgba(139,15,15,.45);
            animation: toastIn .25s ease-out
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translate(-50%,-8px)
            }

            to {
                opacity: 1;
                transform: translate(-50%,0)
            }
        }

        #wn-timer {
            position: fixed;
            z-index: 11;
            top: calc(10px + var(--safe-t));
            left: calc(14px + var(--safe-l));
            font: 26px "MonoFontBold","MonoFont",monospace;
            color: #e6d6d2;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(192,24,24,.7),0 2px 2px #000;
            pointer-events: none;
            font-variant-numeric: tabular-nums
        }

        #btn-jump, #btn-dash {
            display: none;
            position: fixed;
            z-index: 11;
            bottom: calc(18px + var(--safe-b));
            width: 84px;
            height: 84px;
            border-radius: 50%;
            padding: 0;
            font: 15px "MonoFontBold","MonoFont",monospace;
            color: #eee;
            background: rgba(30,6,6,.55);
            border: 2px solid rgba(192,24,24,.8);
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            cursor: pointer;
            box-shadow: 0 0 14px rgba(139,15,15,.5)
        }

        #btn-jump {
            right: calc(104px + var(--safe-r))
        }

        #btn-dash {
            right: calc(16px + var(--safe-r));
            width: 76px;
            height: 76px
        }

            #btn-jump:active, #btn-dash:active {
                background: rgba(120,12,12,.75);
                transform: scale(.94)
            }

        /* ---------- оверлей мультиплеера ---------- */
        #ui {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 20;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at center,rgba(12,3,3,.82) 0%,rgba(0,0,0,.96) 75%);
            overflow-y: auto;
            overflow-x: hidden;
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
            padding: calc(56px + var(--safe-t)) calc(14px + var(--safe-r)) calc(14px + var(--safe-b)) calc(14px + var(--safe-l));
            box-sizing: border-box
        }

            #ui::before {
                content: "";
                position: fixed;
                inset: 0;
                pointer-events: none;
                background: repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);
                mix-blend-mode: overlay
            }

            #ui::after {
                content: "";
                position: fixed;
                inset: 0;
                pointer-events: none;
                box-shadow: inset 0 0 160px 40px #000
            }

        .panel {
            display: none;
            position: relative;
            z-index: 1;
            margin: auto;
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            padding: 24px 22px 20px;
            background: linear-gradient(180deg,#0e0808,var(--panel));
            border: 1px solid var(--line);
            border-top: 2px solid var(--blood);
            border-radius: 6px;
            box-shadow: 0 0 40px rgba(0,0,0,.9),0 0 26px rgba(139,15,15,.25);
            -webkit-user-select: text;
            user-select: text
        }

            .panel h2 {
                margin: 0 0 18px;
                text-align: center;
                font: 26px "MonoFontBold","MonoFont",monospace;
                letter-spacing: 4px;
                color: var(--blood-hi);
                text-shadow: 0 0 10px rgba(192,24,24,.6);
                animation: flick 5s infinite
            }

        @keyframes flick {
            0%,92%,100% {
                opacity: 1
            }

            93% {
                opacity: .55
            }

            94% {
                opacity: 1
            }

            96% {
                opacity: .7
            }

            97% {
                opacity: 1
            }
        }

        .panel label, .lbl {
            display: block;
            margin: 0 0 5px;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--dim)
        }

        .panel input, .panel select {
            width: 100%;
            box-sizing: border-box;
            height: 44px;
            padding: 0 12px;
            margin: 0 0 14px;
            background: #060303;
            color: var(--ink);
            border: 1px solid #3a2020;
            border-radius: 4px;
            font: 16px "MonoFont",ui-monospace,Menlo,Consolas,monospace;
            outline: none;
            -webkit-user-select: text;
            user-select: text;
            -webkit-appearance: none;
            appearance: none
        }

            .panel input:focus, .panel select:focus {
                border-color: var(--blood-hi);
                box-shadow: 0 0 8px rgba(192,24,24,.45)
            }

            .panel input::placeholder {
                color: #4a3c38
            }

        #code-in {
            text-transform: uppercase;
            letter-spacing: 6px;
            text-align: center;
            font-size: 20px
        }

        .panel select {
            background-image: linear-gradient(45deg,transparent 50%,var(--blood-hi) 50%),linear-gradient(135deg,var(--blood-hi) 50%,transparent 50%);
            background-position: calc(100% - 18px) 19px,calc(100% - 12px) 19px;
            background-size: 6px 6px;
            background-repeat: no-repeat;
            padding-right: 34px
        }

            .panel select:disabled {
                opacity: .55
            }

        .panel option {
            background: #0b0606;
            color: var(--ink)
        }

            .panel option:disabled {
                color: #4a3c38
            }

        .panel button {
            display: block;
            width: 100%;
            height: 46px;
            margin: 0 0 10px;
            padding: 0 12px;
            box-sizing: border-box;
            background: #140808;
            color: var(--ink);
            border: 1px solid var(--blood);
            border-radius: 4px;
            cursor: pointer;
            font: 17px "MonoFontBold","MonoFont",monospace;
            letter-spacing: 2px;
            text-transform: uppercase;
            touch-action: manipulation;
            transition: background .15s,box-shadow .15s,color .15s
        }

            .panel button:hover, .panel button:active {
                background: #3a0b0b;
                box-shadow: 0 0 12px rgba(192,24,24,.5);
                color: #fff
            }

            .panel button:disabled {
                opacity: .45;
                cursor: default;
                box-shadow: none;
                background: #140808;
                color: var(--ink)
            }

            .panel button.primary {
                background: var(--blood);
                border-color: var(--blood-hi);
                color: #fff
            }

                .panel button.primary:hover, .panel button.primary:active {
                    background: var(--blood-hi)
                }

            .panel button.ghost {
                border-color: #3a2a2a;
                color: var(--dim)
            }

        .sep {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 6px 0 14px;
            color: #4a3c38;
            font-size: 13px;
            letter-spacing: 2px
        }

            .sep::before, .sep::after {
                content: "";
                flex: 1;
                height: 1px;
                background: var(--line)
            }

        #mp-err {
            min-height: 18px;
            margin: 0 0 10px;
            font-size: 14px;
            line-height: 1.3;
            color: #ff5a4d;
            text-align: center
        }

            #mp-err:empty {
                min-height: 0;
                margin: 0
            }

        /* лобби */
        .codebox {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 0 14px;
            padding: 10px 12px;
            background: #060303;
            border: 1px dashed var(--blood);
            border-radius: 4px
        }

            .codebox .code-wrap {
                flex: 1;
                min-width: 0
            }

                .codebox .code-wrap small {
                    display: block;
                    font-size: 12px;
                    letter-spacing: 1px;
                    color: var(--dim);
                    text-transform: uppercase
                }

        #lb-code {
            font: 30px "MonoFontBold","MonoFont",monospace;
            letter-spacing: 8px;
            color: #f0e0dc;
            text-shadow: 0 0 8px rgba(192,24,24,.6);
            -webkit-user-select: all;
            user-select: all
        }

        .panel .codebox button {
            width: auto;
            height: 38px;
            margin: 0;
            font-size: 13px;
            letter-spacing: 1px;
            flex: none
        }

        #lb-count {
            margin: 0 0 6px;
            font-size: 14px;
            letter-spacing: 1px;
            color: var(--dim);
            text-transform: uppercase
        }

        #lb-players {
            list-style: none;
            margin: 0 0 14px;
            padding: 0;
            max-height: 176px;
            overflow-y: auto;
            touch-action: pan-y;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: #060303
        }

            #lb-players li {
                padding: 9px 12px;
                font-size: 16px;
                border-bottom: 1px solid #1a1010;
                word-break: break-word
            }

                #lb-players li:last-child {
                    border-bottom: 0
                }

                #lb-players li::before {
                    content: "☠ ";
                    color: var(--blood-hi)
                }

        #lb-desc {
            min-height: 38px;
            margin: -4px 0 14px;
            padding: 9px 12px;
            font-size: 14px;
            line-height: 1.4;
            color: #b8aaa5;
            background: #0a0505;
            border-left: 3px solid var(--blood);
            border-radius: 0 4px 4px 0
        }

        #lb-wait {
            display: none;
            margin: 0 0 12px;
            padding: 10px;
            text-align: center;
            font-size: 16px;
            color: var(--dim);
            animation: pulse 1.8s ease-in-out infinite
        }

        @keyframes pulse {
            0%,100% {
                opacity: .45
            }

            50% {
                opacity: 1
            }
        }

        .row2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px
        }

        /* низкие экраны (телефон в горизонтали) */
        @media (max-height:520px) {
            #ui {
                padding-top: calc(10px + var(--safe-t));
                align-items: flex-start
            }

            .panel {
                padding: 14px 16px 10px;
                max-width: 640px
            }

                .panel h2 {
                    font-size: 20px;
                    margin-bottom: 10px;
                    letter-spacing: 3px
                }

                .panel input, .panel select {
                    height: 38px;
                    margin-bottom: 8px
                }

                .panel button {
                    height: 40px;
                    margin-bottom: 8px;
                    font-size: 15px
                }

            #p-mp {
                max-width: 560px
            }

                #p-mp .cols {
                    display: grid;
                    grid-template-columns: 1fr 1fr;
                    gap: 0 18px
                }

                #p-mp .sep {
                    display: none
                }

            #p-lobby .lobby-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 0 18px
            }

            #lb-players {
                max-height: 110px
            }

            #lb-code {
                font-size: 24px
            }

            #btn-jump {
                width: 72px;
                height: 72px
            }

            #btn-dash {
                width: 66px;
                height: 66px
            }

            #btn-jump {
                right: calc(92px + var(--safe-r))
            }
        }

        @media (max-width:360px) {
            .panel {
                padding: 18px 14px 14px
            }

            #lb-code {
                font-size: 24px;
                letter-spacing: 5px
            }
        }
    </style>
</head>
<body>
    <div id="wrap"><canvas id="c"></canvas></div>
    <div id="rot">Поверни телефон горизонтально</div>

    <!-- Полноэкранный режим -->
    <button id="btn-fs" type="button" tabindex="-1" aria-label="Полный экран" title="Полный экран">
        <svg class="ico-enter" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
        <svg class="ico-exit" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" /></svg>
    </button>

    <!-- HUD -->
    <div id="wn-toast"></div>
    <div id="wn-timer" style="display:none">00:00.0</div>
    <button id="btn-jump" type="button" tabindex="-1">Прыжок</button>
    <button id="btn-dash" type="button" tabindex="-1">Рывок</button>

    <!-- Оверлей мультиплеера -->
    <div id="ui">
        <!-- Экран входа -->
        <div id="p-mp" class="panel">
            <h2>МУЛЬТИПЛЕЕР</h2>
            <div class="cols">
                <div>
                    <label for="nick">Твой ник</label>
                    <input id="nick" maxlength="12" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Игрок">
                    <button id="btn-create" class="primary" type="button">Создать лобби</button>
                </div>
                <div>
                    <div class="sep">ИЛИ</div>
                    <label for="code-in">Код комнаты</label>
                    <input id="code-in" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="•••••">
                    <button id="btn-join" type="button">Войти в лобби</button>
                </div>
            </div>
            <div id="mp-err"></div>
            <button id="btn-mp-back" class="ghost" type="button">Назад</button>
        </div>

        <!-- Комната ожидания -->
        <div id="p-lobby" class="panel">
            <h2>ЛОББИ</h2>
            <div class="lobby-grid">
                <div>
                    <div class="codebox">
                        <div class="code-wrap"><small>Код комнаты</small><span id="lb-code"></span></div>
                        <button id="btn-copy" type="button">Скопировать</button>
                    </div>
                    <div id="lb-count"></div>
                    <ul id="lb-players"></ul>
                </div>
                <div>
                    <label for="lb-max">Максимум игроков</label>
                    <select id="lb-max">
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4" selected>4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                    </select>
                    <label for="lb-mode">Режим игры</label>
                    <select id="lb-mode">
                        <option value="normal">Обычный</option>
                        <option value="nightmare">Кошмарище</option>
                        <option value="speed">Спидран</option>
                    </select>
                    <div id="lb-desc"></div>
                    <button id="btn-start" class="primary" type="button">Начать игру</button>
                    <div id="lb-wait">Ожидание хоста...</div>
                    <button id="btn-leave" class="ghost" type="button">Выйти из лобби</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Полноэкранный режим (отдельно от игровой логики; работает в меню, лобби и игре)
        (function(){
        var btn=document.getElementById("btn-fs"),de=document.documentElement;
        var req=de.requestFullscreen||de.webkitRequestFullscreen;
        var exit=document.exitFullscreen||document.webkitExitFullscreen;
        function cur(){return document.fullscreenElement||document.webkitFullscreenElement||null}
        if(!req){btn.style.display="none";return}   // например, iPhone Safari — полноэкранный режим недоступен
        function sync(){btn.classList.toggle("on",!!cur())}
        function toggle(){
        if(cur()){
        try{var p=exit.call(document);if(p&&p.catch)p.catch(function(){})}catch(e){}
        try{screen.orientation&&screen.orientation.unlock&&screen.orientation.unlock()}catch(e){}
        }else{
        try{
        var p=req.call(de);
        if(p&&p.then)p.then(function(){
        try{var l=screen.orientation&&screen.orientation.lock&&screen.orientation.lock("landscape");l&&l.catch&&l.catch(function(){})}catch(e){}
        }).catch(function(){});
        }catch(e){}
        }
        }
        btn.addEventListener("mousedown",function(e){e.preventDefault()});   // не забирать фокус (иначе Пробел нажмёт кнопку)
        btn.addEventListener("click",function(e){e.stopPropagation();toggle();btn.blur()});
        btn.addEventListener("pointerdown",function(e){e.stopPropagation()});
        document.addEventListener("fullscreenchange",sync);
        document.addEventListener("webkitfullscreenchange",sync);
        sync();
        })();
    </script>
    <script type="module" src="net.js"></script>
    <script src="script.js" defer></script>
</body>
</html>
